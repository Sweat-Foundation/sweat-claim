name: Push

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Actor
        run: echo ${{ github.actor }}

      - name: Build
        run: make build-in-docker

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sweat-claim
          path: res/sweat_claim.wasm

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: make lint

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.21.1/cargo-near-installer.sh | sh

      - name: Integration tests
        run: make integration

  check-binary-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Hash
        run: make hash

      - name: Commit Hash
        run: echo ${{ github.event.pull_request.head.sha }}

  push:
    needs: [build, lint, integration-tests, check-binary-hash]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token
          fetch-depth: 0 # otherwise, you will failed to push refs to dest repo

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: sweat-claim
          path: res/

      - name: Commit & Push changes
        if: ${{ github.actor != 'sweatcoin' }}
        uses: actions-js/push@master
        with:
          message: Updated binary
          branch: main
          github_token: ${{ secrets.ACTIONS_TOKEN }}

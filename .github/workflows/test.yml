name: Test

on:
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        run: make build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: make lint

  # Integration tests are temporarily disabled while they are migrated off
  # `nitka`/`sweat-model`. Re-enable this job once the crate builds again.
  # integration-tests:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v5
  #
  #     - name: Integration tests
  #       run: make integration

  check-binary-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Hash
        run: make hash

      - name: Commit Hash
        run: echo ${{ github.event.pull_request.head.sha }}

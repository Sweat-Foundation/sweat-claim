[package]
name = "integration-tests"
version = "1.0.0"
publish = false
edition = "2021"

[dev-dependencies]
near-workspaces = "0.22"
anyhow = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Empty `[workspace]` makes this crate its own workspace root, detached from the
# parent so it can use its own `rust-toolchain.toml` and dependency lock.
[workspace]

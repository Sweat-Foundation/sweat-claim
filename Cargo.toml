[workspace]

resolver = "2"

default-members = ["contract"]
# `integration-tests` is intentionally NOT a member: it is its own workspace
# (see integration-tests/Cargo.toml) pinned to a newer toolchain so it can use a
# recent `near-workspaces`, while the contract stays on the reproducible-build
# toolchain. Run it with `make integration`.
members = ["contract", "model"]

[workspace.dependencies]
claim-model = { path = "model" }

near-sdk = "5.28"

# Optimized release profile for the contract wasm.
# `cargo near build` builds with `--release` by default and picks this up, so no
# custom `--profile` flag is needed (these flags are NOT injected by cargo-near).
[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations.
overflow-checks = true

[package]
name = "sweat_claim"
version = "2.0.3"
authors = ["Sweat Economy"]
edition = "2021"
repository = "https://github.com/sweatco/sweat-claim"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
claim-model = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
plotters = "0.3.5"
rand = "0.8.5"

# Configures the WASM-reproducible build (`cargo near build reproducible-wasm`),
# per NEP-0330: https://github.com/near/NEPs/blob/master/neps/nep-0330.md
#
# Note: cargo-near 0.21.1+ embeds the exact git commit SHA into the wasm's NEP-330
# metadata, so a byte-identical rebuild-vs-committed-wasm hash check across commits
# is no longer meaningful (this obsoleted scripts/check-contract-hash.sh, removed).
# That metadata is instead for post-deploy source verification of a deployed
# on-chain contract, by external tools like SourceScan or near-verify-rs.
[package.metadata.near.reproducible_build]
# docker image, descriptor of build environment
image = "sourcescan/cargo-near:0.21.1-rust-1.93.0"
# tag after colon above serves only descriptive purpose; image is identified by digest
image_digest = "sha256:79b789c81ba19ec30794a6b1046b02dcaf5c055994b22cc7c9af67ab5096b095"
# list of environment variable names whose values, if set, are used as external
# build parameters in a reproducible manner
passed_env = []
# build command run inside the docker container.
# `--no-abi` is required because the forked near-sdk 4.x predates cargo-near's
# ABI generation (contract types don't implement `JsonSchema`).
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[package]
name = "sweat_claim"
version = "2.0.3"
authors = ["Sweat Economy"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["release"]
release = ["claim-model/release-api"]
integration-test = ["claim-model/release-api", "claim-model/integration-methods"]
integration-api = ["claim-model/integration-api"]

[dependencies]
near-sdk = { workspace = true }
claim-model = { workspace = true }

[dev-dependencies]
plotters = "0.3.5"
rand = "0.8.5"

# Configures the WASM-reproducible build (`cargo near build reproducible-wasm`),
# per NEP-0330: https://github.com/near/NEPs/blob/master/neps/nep-0330.md
[package.metadata.near.reproducible_build]
# docker image, descriptor of build environment
image = "sourcescan/cargo-near:0.19.0-rust-1.86.0"
# tag after colon above serves only descriptive purpose; image is identified by digest
image_digest = "sha256:772638e343baeeea24e49062c7d424274f3441452cc06ce97fc4e5695b19fecc"
# list of environment variable names whose values, if set, are used as external
# build parameters in a reproducible manner
passed_env = []
# build command run inside the docker container.
# `--no-abi` is required because the forked near-sdk 4.x predates cargo-near's
# ABI generation (contract types don't implement `JsonSchema`).
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]
